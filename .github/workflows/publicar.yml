name: Convertir fotos y publicar

# Cada vez que subís fotos a la carpeta fotos/, esto las convierte a PDF,
# actualiza la página y la publica en GitHub Pages.
on:
  push:
    branches: [main]
    paths: ["fotos/**", "docs/**", "scripts/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install pillow pillow-heif

      - name: Convertir fotos a PDF
        run: python scripts/build.py

      - name: Guardar los PDF generados en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Generar PDFs y data.json [skip ci]"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
