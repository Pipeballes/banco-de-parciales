name: Convertir fotos y publicar

# Cada vez que se sube algo a parciales/: convierte las fotos a PDF (y borra las
# imágenes), arma la página y la publica en GitHub Pages.
on:
  push:
    branches: [main]
    paths: ["parciales/**", "profesores.yml", "docs/**", "scripts/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # para saber la fecha real en que se subió cada foto

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install pillow pillow-heif pyyaml

      - name: Convertir fotos a PDF y armar la página
        run: python scripts/build.py

      - name: Guardar en el repo los PDF que salieron de fotos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A parciales/ README.md
          git diff --cached --quiet || git commit -m "Convertir fotos a PDF y actualizar README [skip ci]"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
